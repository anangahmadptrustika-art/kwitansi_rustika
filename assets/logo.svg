<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Rustika Consultant">
  <defs>
    <radialGradient id="rcFace" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#3b3b3b"/>
      <stop offset="60%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="rcGold" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFDD66"/>
      <stop offset="45%" stop-color="#F2B400"/>
      <stop offset="100%" stop-color="#C58A00"/>
    </linearGradient>
  </defs>

  <!-- Emblem lingkaran -->
  <g>
    <circle cx="230" cy="240" r="216" fill="#000" opacity="0.25"/>
    <circle cx="230" cy="240" r="210" fill="#0c0c0c"/>
    <circle cx="230" cy="240" r="196" fill="url(#rcFace)"/>
    <circle cx="230" cy="240" r="196" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="3"/>

    <!-- Kipas garis (kiri R) -->
    <g fill="url(#rcGold)">
      <rect x="92"  y="190" width="20" height="120" rx="10"/>
      <rect x="124" y="165" width="20" height="175" rx="10"/>
      <rect x="156" y="140" width="20" height="222" rx="10"/>
    </g>

    <!-- Huruf R -->
    <text x="150" y="362" font-family="'Arial Black', Arial, sans-serif" font-weight="900"
          font-size="330" fill="url(#rcGold)">R</text>

    <!-- Sayap / garis bawah -->
    <g fill="url(#rcGold)">
      <rect x="198" y="366" width="156" height="17" rx="8.5"/>
      <rect x="214" y="392" width="124" height="17" rx="8.5"/>
    </g>
  </g>

  <!-- Wordmark (menimpa kanan lingkaran) -->
  <g>
    <rect x="345" y="150" width="295" height="186" fill="#ffffff"/>
    <text x="360" y="234" font-family="Arial, Helvetica, sans-serif" font-weight="800"
          font-size="64" letter-spacing="0.5" fill="#141414">RUSTIKA</text>
    <text x="362" y="288" font-family="Arial, Helvetica, sans-serif" font-weight="600"
          font-size="40" letter-spacing="7" fill="#2b2b2b">CONSULTANT</text>
    <text x="364" y="316" font-family="Arial, Helvetica, sans-serif" font-weight="700"
          font-size="15.5" letter-spacing="1.2" fill="#8a8a8a">PT RUSTIKA GLOBAL INDONESIA</text>
  </g>
</svg>
