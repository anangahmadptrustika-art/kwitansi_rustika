<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kwitansi Otomatis — Rustika Consultant</title>
  <meta name="description" content="Aplikasi kwitansi otomatis PT Rustika Global Indonesia" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar no-print">
      <div class="brand">
        <img src="assets/logo.svg" alt="Rustika" class="brand-logo" />
      </div>
      <nav class="nav">
        <a class="nav-link active" data-route="dashboard" href="#dashboard"><span class="ni">📊</span> Dashboard</a>
        <a class="nav-link" data-route="create" href="#create"><span class="ni">➕</span> Buat Kwitansi</a>
        <a class="nav-link" data-route="list" href="#list"><span class="ni">🧾</span> Daftar Kwitansi</a>
        <a class="nav-link" data-route="settings" href="#settings"><span class="ni">⚙️</span> Pengaturan</a>
      </nav>
      <div class="sidebar-foot">
        <div class="muted small">Kwitansi Otomatis v1.0</div>
        <div class="muted small">PT Rustika Global Indonesia</div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar no-print">
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
        <div class="topbar-title">Aplikasi Kwitansi Otomatis</div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="toast-host" class="toast-host no-print"></div>
  <div id="modal-host" class="no-print"></div>

  <!-- Scripts (urutan penting) -->
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/app.js"></script>
  <script>
    // toggle sidebar di layar kecil
    document.getElementById('hamburger').addEventListener('click', function () {
      document.querySelector('.sidebar').classList.toggle('open');
    });
    document.addEventListener('click', function (e) {
      if (e.target.closest('.nav-link')) document.querySelector('.sidebar').classList.remove('open');
    });
  </script>
</body>
</html>
